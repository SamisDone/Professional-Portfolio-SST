<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      __SITE_URL__ is replaced at build time from VITE_SITE_URL (see
      vite.config.ts). These have to be absolute: Open Graph crawlers do not
      resolve relative paths, so a relative image silently yields a blank card.
    -->
    <link rel="canonical" href="__SITE_URL__/" />

    <title>Samonwita Sarker — Full-Stack Developer &amp; AI Researcher</title>
    <meta
      name="description"
      content="CSE undergraduate at CUET building full-stack products with React, Node.js and PostgreSQL. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta name="author" content="Samonwita Sarker" />
    <meta name="theme-color" content="#200c27" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />


    <!-- Open Graph: what LinkedIn, Slack and iMessage render for the link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Samonwita Sarker" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta
      property="og:title"
      content="Samonwita Sarker — Full-Stack Developer &amp; AI Researcher"
    />
    <meta
      property="og:description"
      content="CSE '27 at CUET. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samonwita Sarker, full-stack developer and AI researcher."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Samonwita Sarker — Full-Stack Developer &amp; AI Researcher"
    />
    <meta
      name="twitter:description"
      content="CSE '27 at CUET. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />

    <!-- Structured data, so a search result can show the role and affiliation. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Samonwita Sarker",
        "url": "__SITE_URL__/",
        "email": "mailto:sarker.samonwita@gmail.com",
        "jobTitle": "Full-Stack Developer and AI Researcher",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Chittagong University of Engineering & Technology"
        },
        "knowsAbout": [
          "Full-stack web development",
          "Explainable AI",
          "Natural language processing",
          "React",
          "Node.js",
          "PostgreSQL"
        ],
        "sameAs": [
          "https://github.com/SamisDone",
          "https://www.linkedin.com/in/samonwita-sarker-a87737262/",
          "https://codeforces.com/profile/jinxed_sam"
        ]
      }
    </script>

    <!--
      Boot shell. Inlined so it paints before the CSS and JS bundles arrive,
      and shaped like the real header and hero so the first frame is the page
      arriving rather than a blank sheet. React clears #root when it mounts.
    -->
    <style>
      :root { --boot-paper:#200c27; --boot-rule:#462a51; --boot-bar:#31153b; }
      :root[data-theme="light"] { --boot-paper:#f9f4fa; --boot-rule:#e2d8e5; --boot-bar:#ece3ee; }
      html { background: var(--boot-paper); }
      #boot { animation: boot-in .35s ease-out both; }
      #boot .bar { display:block; background:var(--boot-bar); border-radius:2px; }
      #boot .shimmer { position:relative; overflow:hidden; }
      #boot .shimmer::after {
        content:""; position:absolute; inset:0; transform:translateX(-100%);
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
        animation:boot-sweep 1.5s ease-in-out infinite;
      }
      @keyframes boot-sweep { to { transform:translateX(100%); } }
      @keyframes boot-in { from { opacity:0 } }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .shimmer::after { animation:none; }
        #boot .shimmer::after { display:none; }
      }
    </style>
  </head>
  <body class="bg-bg text-text-primary font-body">
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div style="border-bottom:1px solid var(--boot-rule);height:64px">
          <div style="max-width:1240px;margin:0 auto;padding:0 32px;height:100%;display:flex;align-items:center;justify-content:space-between">
            <span class="bar shimmer" style="width:74px;height:12px"></span>
            <span class="bar shimmer" style="width:112px;height:34px"></span>
          </div>
        </div>
        <div style="max-width:1240px;margin:0 auto;padding:80px 32px 0;display:flex;gap:32px">
          <div style="flex:1 1 66%;min-width:0">
            <span class="bar shimmer" style="width:148px;height:12px"></span>
            <span class="bar shimmer" style="width:min(690px,96%);height:78px;margin-top:30px"></span>
            <span class="bar shimmer" style="width:min(560px,88%);height:18px;margin-top:34px"></span>
            <span class="bar shimmer" style="width:min(310px,52%);height:18px;margin-top:12px"></span>
            <div style="display:flex;gap:12px;margin-top:44px">
              <span class="bar shimmer" style="width:174px;height:52px"></span>
              <span class="bar shimmer" style="width:124px;height:52px"></span>
            </div>
          </div>
          <div style="flex:0 1 30%;min-width:0;padding-left:32px;border-left:1px solid var(--boot-rule);align-self:flex-end;padding-bottom:6px">
            <span class="bar shimmer" style="width:62px;height:11px"></span>
            <span class="bar shimmer" style="width:172px;height:13px;margin-top:9px"></span>
            <span class="bar shimmer" style="width:44px;height:11px;margin-top:26px"></span>
            <span class="bar shimmer" style="width:196px;height:13px;margin-top:9px"></span>
            <span class="bar shimmer" style="width:52px;height:11px;margin-top:26px"></span>
            <span class="bar shimmer" style="width:238px;height:13px;margin-top:9px"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
