<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      __SITE_URL__ is replaced at build time from VITE_SITE_URL (see
      vite.config.ts). These have to be absolute: Open Graph crawlers do not
      resolve relative paths, so a relative image silently yields a blank card.
    -->
    <link rel="canonical" href="__SITE_URL__/" />

    <title>Samonwita Sarker — Full-Stack Developer &amp; AI Researcher</title>
    <meta
      name="description"
      content="CSE undergraduate at CUET building full-stack products with React, Node.js and PostgreSQL. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta name="author" content="Samonwita Sarker" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: preconnect so the display face isn't blocked behind DNS + TLS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero still frame, fetched before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      href="https://image.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g/thumbnail.jpg?width=1280&time=2"
    />

    <!-- Open Graph: what LinkedIn, Slack and iMessage render for the link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Samonwita Sarker" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta
      property="og:title"
      content="Samonwita Sarker — Full-Stack Developer &amp; AI Researcher"
    />
    <meta
      property="og:description"
      content="CSE '27 at CUET. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samonwita Sarker, full-stack developer and AI researcher."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Samonwita Sarker — Full-Stack Developer &amp; AI Researcher"
    />
    <meta
      name="twitter:description"
      content="CSE '27 at CUET. Published Chrome extensions, an IEEE paper on explainable AI, and a 7th-place finish at an ACL 2026 shared task."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />

    <!-- Structured data, so a search result can show the role and affiliation. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Samonwita Sarker",
        "url": "__SITE_URL__/",
        "email": "mailto:sarker.samonwita@gmail.com",
        "jobTitle": "Full-Stack Developer and AI Researcher",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Chittagong University of Engineering & Technology"
        },
        "knowsAbout": [
          "Full-stack web development",
          "Explainable AI",
          "Natural language processing",
          "React",
          "Node.js",
          "PostgreSQL"
        ],
        "sameAs": [
          "https://github.com/SamisDone",
          "https://www.linkedin.com/in/samonwita-sarker-a87737262/",
          "https://codeforces.com/profile/jinxed_sam"
        ]
      }
    </script>
  </head>
  <body class="bg-bg text-text-primary font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
