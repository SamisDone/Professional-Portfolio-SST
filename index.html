<!doctype html>
<html lang="en" data-section="__PAGE_SECTION__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Switches the motion layer on before the first paint, so an entrance
      starts from its first frame instead of the finished page redrawing. If
      the site's script has not taken over within 1.5s, the starting states
      come off and everything shows; src/lib/motion.ts then leaves what is
      already on screen as it is. Allowed by its sha256 in public/_headers,
      which scripts/check-dist.mjs checks against the built page.
    -->
    <script>(function(d,w){try{if(w.matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver"in w))return;d.classList.add("m-js");w.__mOff=setTimeout(function(){d.classList.remove("m-js")},1500)}catch(e){}})(document.documentElement,window)</script>

    <!--
      Every double-underscore token below is filled per route at build time by the route-meta
      plugin in vite.config.ts, from src/lib/meta.ts and the single SITE_URL
      in src/lib/site.ts. Absolute URLs, because Open Graph crawlers do not
      resolve relative ones. Structured data is rendered by the pages
      themselves (src/lib/structured.ts), so each page carries its own.
      The canonical link is an HTML comment until it is filled, so the dev
      server parses the same head as production: raw text here would end the
      head and push everything after it into the body.
    -->
    <!--__CANONICAL__-->
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__PAGE_DESCRIPTION__" />
    <meta name="author" content="Samonwita Sarker" />
    <meta name="theme-color" content="#f3f1ec" />
    <!--__HEAD_EXTRA__-->

    <!--
      Both fonts start with the CSS instead of after it has been parsed, so
      they are in before the first paint: text set first in the fallback
      reflowed when Archivo arrived, a layout shift of up to 0.02 on Home.
      Vite rewrites these paths to the hashed files.
    -->
    <link rel="preload" href="/src/fonts/Archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/MartianMono-Label.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Phones only: the proof row's domain lines, on the first screen there. -->
    <link rel="preload" href="/src/fonts/MartianMono-Narrow.woff2" as="font" type="font/woff2" crossorigin media="(max-width: 639.98px)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores an SVG here, so the home-screen icon is a 180px PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: what LinkedIn, Slack and iMessage render for the link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Samonwita Sarker" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:title" content="__PAGE_TITLE__" />
    <meta property="og:description" content="__PAGE_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__OG_IMAGE_ALT__" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__PAGE_TITLE__" />
    <meta name="twitter:description" content="__PAGE_DESCRIPTION__" />
    <meta name="twitter:image" content="__OG_IMAGE__" />
    <meta name="twitter:image:alt" content="__OG_IMAGE_ALT__" />

    <!--
      Boot shell. Inlined so it paints before the CSS arrives, and shaped like
      the home page: header, name block, hero row, proof row. Flat paper-2
      blocks on paper, no shimmer. Prerendering replaces it with the real page
      on every route, so in practice it shows only in development.
      The hex values are the tokens in src/index.css; scripts/check-bans.mjs
      fails the build if they drift.
    -->
    <style>
      html { background: #f3f1ec; }
      #boot .b { display: block; background: #e6e3db; }
      #boot .s { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
      @media (min-width: 640px) { #boot .s { padding: 0 32px; } }
      @media (min-width: 1024px) { #boot .s { padding: 0 48px; } }
    </style>
  </head>
  <body class="bg-paper font-sans text-ink">
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div style="border-bottom: 2px solid #111111; height: 64px">
          <div class="s" style="height: 100%; display: flex; align-items: center; justify-content: space-between">
            <span class="b" style="width: 32px; height: 16px"></span>
            <span class="b" style="width: 120px; height: 48px"></span>
          </div>
        </div>
        <div class="s" style="padding-top: 32px">
          <span class="b" style="width: min(320px, 80%); height: 12px"></span>
          <span class="b" style="width: min(1080px, 96%); height: clamp(43px, 9.9vw, 130px); margin-top: 16px; background: #ff5a1f; border: 2px solid #111111"></span>
          <span class="b" style="width: min(720px, 66%); height: clamp(43px, 9.9vw, 130px); margin-top: -2px; background: #ff5a1f; border: 2px solid #111111"></span>
          <span class="b" style="width: min(560px, 90%); height: 58px; margin-top: 32px"></span>
          <span class="b" style="width: 168px; height: 48px; margin-top: 24px"></span>
          <span class="b" style="width: 100%; height: 132px; margin-top: 48px; border-top: 4px solid #111111"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
