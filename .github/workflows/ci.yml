name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The ban script runs first inside `build` too; it is its own step here
      # so a banned style shows up by name in the checks list.
      - run: npm run check:bans
      - run: npm run lint
      - run: npm run build
